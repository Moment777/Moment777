{%- comment -%}
  Usage: {% include figure.html src="/assets/img/foo.png" caption="What the reader is looking at" alt="optional alt text" %}
{%- endcomment -%}
<figure class="shot">
  <a href="{{ include.src | relative_url }}" target="_blank" rel="noopener">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | escape }}" loading="lazy">
  </a>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
